<svg width="1280" height="400" viewBox="0 0 1280 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF7F9"/>
      <stop offset="55%" stop-color="#FCE9F0"/>
      <stop offset="100%" stop-color="#F6D8E4"/>
    </linearGradient>
    <radialGradient id="orbA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(140 60) scale(420 300)">
      <stop offset="0%" stop-color="#E56B92" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#E56B92" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1040 220) scale(380 280)">
      <stop offset="0%" stop-color="#A32952" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#A32952" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E86B94"/>
      <stop offset="100%" stop-color="#9A2049"/>
    </linearGradient>
    <linearGradient id="meBubble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E0608C"/>
      <stop offset="100%" stop-color="#B8325F"/>
    </linearGradient>
    <linearGradient id="photo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD3E1"/>
      <stop offset="100%" stop-color="#F59BB8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#871D41" flood-opacity="0.18"/>
    </filter>
    <filter id="cardShadow" x="-15%" y="-10%" width="130%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#871D41" flood-opacity="0.20"/>
    </filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#A32952" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="1278" height="398" rx="32" fill="url(#bg)" stroke="#E56B92" stroke-opacity="0.22" stroke-width="2"/>
  <rect x="2" y="2" width="1276" height="396" rx="31" fill="url(#dots)"/>
  <rect x="2" y="2" width="1276" height="396" rx="31" fill="url(#orbA)"/>
  <rect x="2" y="2" width="1276" height="396" rx="31" fill="url(#orbB)"/>

  <!-- ===== Left column: lockup + copy ===== -->
  <g transform="translate(96, 70)" filter="url(#shadow)">
    <rect width="88" height="88" rx="26" fill="url(#rose)"/>
    <rect x="2" y="2" width="84" height="84" rx="24" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5"/>
    <g transform="translate(44, 44)">
      <path d="M0 -24 C12 -24 20 -13 17 -1 C14 10 5 16 0 19 C-5 16 -14 10 -17 -1 C-20 -13 -12 -24 0 -24 Z" fill="#FFFFFF" fill-opacity="0.95"/>
      <path d="M0 -15 C7 -15 11 -8 9 -1 C7 5 3 9 0 11 C-3 9 -7 5 -9 -1 C-11 -8 -7 -15 0 -15 Z" fill="#E86B94" fill-opacity="0.55"/>
      <circle cx="0" cy="-3" r="4.5" fill="#9A2049" fill-opacity="0.85"/>
      <circle cx="16" cy="-16" r="2.5" fill="#FFE0EB"/>
    </g>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Segoe UI', sans-serif">
    <text x="206" y="132" font-size="62" font-weight="800" letter-spacing="-1.2" fill="#1E1619">RosePanel Bot</text>
    <text x="96" y="218" font-size="34" font-weight="700" fill="#1E1619">在面板里直接<tspan fill="#B8325F">聊天、发图</tspan>的</text>
    <text x="96" y="262" font-size="34" font-weight="700" fill="#1E1619">防广告 Telegram 私聊机器人</text>
  </g>

  <g transform="translate(96, 296)" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="19" font-weight="600">
    <rect x="0" y="0" width="212" height="44" rx="22" fill="#A32952"/>
    <text x="106" y="29" text-anchor="middle" fill="#FFFFFF">🛡️ 五层防广告护盾</text>

    <rect x="220" y="0" width="276" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.9" stroke="#A32952" stroke-opacity="0.18"/>
    <text x="358" y="29" text-anchor="middle" fill="#A32952">🧩 4 种人机验证 · 含动图题</text>

    <rect x="506" y="0" width="226" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.9" stroke="#A32952" stroke-opacity="0.18"/>
    <text x="619" y="29" text-anchor="middle" fill="#A32952">📡 节点探针 · 网站书签</text>
  </g>

  <!-- ===== Right column: in-panel chat mock ===== -->
  <g transform="translate(832, 44)" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
    <rect width="352" height="312" rx="28" fill="#FFFFFF" fill-opacity="0.94" filter="url(#cardShadow)"/>
    <rect x="0.75" y="0.75" width="350.5" height="310.5" rx="27.25" stroke="#A32952" stroke-opacity="0.12" stroke-width="1.5"/>

    <!-- header -->
    <circle cx="36" cy="36" r="16" fill="#F7D5E1"/>
    <text x="36" y="42" text-anchor="middle" font-size="16" font-weight="700" fill="#A32952">林</text>
    <text x="62" y="42" font-size="18" font-weight="700" fill="#1E1619">与 林晚星 对话</text>
    <text x="324" y="42" text-anchor="end" font-size="13" font-weight="600" fill="#2E9E6A">● 已同步话题</text>
    <line x1="20" y1="64" x2="332" y2="64" stroke="#A32952" stroke-opacity="0.08"/>

    <!-- visitor bubble -->
    <rect x="20" y="78" width="206" height="40" rx="18" fill="#F6EEF1"/>
    <text x="36" y="104" font-size="16" fill="#3A2B31">可以互换个友链吗？</text>

    <!-- my bubble -->
    <rect x="96" y="128" width="236" height="40" rx="18" fill="url(#meBubble)"/>
    <text x="112" y="154" font-size="16" fill="#FFFFFF">可以呀，面板里直接回你 🌸</text>
    <text x="332" y="186" text-anchor="end" font-size="12" font-weight="600" fill="#B8325F" fill-opacity="0.8">撤回</text>

    <!-- my photo bubble -->
    <rect x="232" y="194" width="100" height="58" rx="14" fill="url(#photo)"/>
    <path d="M248 240 L268 216 L282 230 L292 220 L318 240 Z" fill="#FFFFFF" fill-opacity="0.75"/>
    <circle cx="306" cy="210" r="6" fill="#FFFFFF" fill-opacity="0.85"/>

    <!-- composer -->
    <rect x="20" y="262" width="312" height="36" rx="18" fill="#F6EEF1"/>
    <text x="40" y="285" font-size="14" fill="#9B8790">🖼️  回复 林晚星…</text>
    <rect x="262" y="266" width="66" height="28" rx="14" fill="#A32952"/>
    <text x="295" y="285" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">发送</text>
  </g>
</svg>
